# Hosting platforms provide the port in the PORT environment variable; locally it is 8080.
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Reports with many rows can be large
server.tomcat.max-swallow-size=-1
# Show our friendly error messages to the website
server.error.include-message=always
# Behind a proxy (Render, Railway) so redirects and links use the public https address
server.forward-headers-strategy=framework
