<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ – Test Case Explorer</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1f2933; --muted:#6b7683; --line:#e1e5ea; --brand:#0f766e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Segoe UI, system-ui, -apple-system, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#0f2f2c; color:#fff; padding:22px 24px 20px; }
  header .tag { display:inline-block; background:var(--brand); border-radius:20px; padding:3px 12px; font-size:12px; margin-bottom:8px; letter-spacing:.04em; }
  header h1 { margin:0 0 4px; font-size:24px; } header p { margin:0; opacity:.8; font-size:14px; }
  main { max-width:1500px; margin:0 auto; padding:16px; }
  .toolbar { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 12px; display:grid; gap:10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row .grow { flex:1; }
  .count { color:var(--muted); font-size:14px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
  .seg button { border:0; background:none; padding:7px 14px; font:inherit; font-size:14px; cursor:pointer; color:var(--ink); }
  .seg button.on { background:var(--brand); color:#fff; }
  button.act { background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px 14px; font:inherit; font-size:14px; cursor:pointer; color:var(--ink); }
  button.act:hover { border-color:var(--brand); color:var(--brand); }
  select.size { border:1px solid var(--line); border-radius:8px; padding:7px 8px; font:inherit; font-size:14px; background:#fff; }
  .tablewrap { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:calc(100vh - 230px); }
  table { border-collapse:separate; border-spacing:0; width:100%; min-width:900px; font-size:14px; }
  th { position:sticky; top:0; background:#eef2f1; text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; z-index:2; font-size:13px; }
  th .arr { color:var(--brand); }
  td { padding:10px 12px; border-bottom:1px solid #eef0f2; vertical-align:top; white-space:pre-wrap; word-break:break-word; line-height:1.5; }
  tr:nth-child(even) td { background:#fafbfb; } tr:hover td { background:#f0f8f7; }
  td.c-id { font-weight:700; white-space:nowrap; } td.c-title { font-weight:600; min-width:200px; }
  td.c-text { min-width:240px; max-width:420px; } td.c-sec { color:var(--muted); min-width:140px; font-size:13px; }
  td.empty { color:#b3bcc6; }
  .pager { display:flex; justify-content:center; align-items:center; gap:12px; margin:14px 0 4px; color:var(--muted); font-size:14px; }
  .pager button { background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; font:inherit; }
  .pager button:disabled { opacity:.4; cursor:default; }
  /* cards view */
  .cards { display:grid; gap:10px; }
  details.tc { background:var(--card); border:1px solid var(--line); border-radius:12px; border-left:5px solid #94a3b8; }
  details.tc.st-PASS { border-left-color:#16a34a; } details.tc.st-FAIL { border-left-color:#dc2626; } details.tc.st-BLOCKED { border-left-color:#f59e0b; }
  details.tc summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  details.tc summary::-webkit-details-marker { display:none; }
  details.tc summary .id { font-weight:700; } details.tc summary .ttl { flex:1; min-width:200px; font-weight:600; }
  details.tc summary .sec { color:var(--muted); font-size:13px; }
  details.tc summary::after { content:"▾"; color:var(--muted); }
  details.tc[open] summary::after { content:"▴"; }
  .body { padding:2px 18px 16px; display:grid; gap:10px; }
  .body .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:2px; }
  .body .txt { white-space:pre-wrap; line-height:1.55; }
  .none { text-align:center; color:var(--muted); padding:40px 10px; }
  @media print { .toolbar { position:static; } .tablewrap { max-height:none; overflow:visible; } }
</style>
</head>
<body>
<header>
  <span class="tag">TEST CASE EXPLORER</span>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div id="meta"></div>
</header>
<main>
  <div id="truncWarn" class="warn" hidden></div>
  <div class="toolbar">
    <div class="row" id="filterBar"></div>
    <div class="row">
      <span class="count" id="count"></span>
      <span class="grow"></span>
      <div class="seg" id="viewSeg"><button data-v="table" class="on">Table</button><button data-v="cards">Cards</button></div>
      <button class="act" id="expand" hidden>Expand all</button>
      <label class="count">Rows per page <select class="size" id="size"><option>25</option><option>50</option><option>100</option></select></label>
      <button class="act" id="csv">Download filtered (CSV)</button>
    </div>
  </div>
  <div id="view"></div>
  <div class="pager"><button id="prev">‹ Previous</button><span id="pg"></span><button id="next">Next ›</button></div>
</main>
<script>
const DATA = /*__DATA__*/null;
/*__COMMON__*/
/*__TC__*/

setTcHeader();

// Column order: the test-case essentials first, then anything else, with their real header names.
const ORDER = [TC.id, TC.title, TC.section, TC.precondition, TC.steps, TC.expected, TC.status].filter(i => i >= 0);
COLS.forEach(c => { if (!ORDER.includes(c.i)) ORDER.push(c.i); });

let view = 'table', page = 0, size = 25, sortIdx = null, sortDir = 1, allOpen = false;
mountFilterBar(document.getElementById('filterBar'), () => { page = 0; render(); });

function sorted(list) {
  if (sortIdx === null) return list;
  const i = sortIdx, d = sortDir;
  return [...list].sort((a, b) => {
    const x = a.r[i], y = b.r[i];
    if (x === null) return 1; if (y === null) return -1;
    return (String(x).localeCompare(String(y), undefined, { numeric: true })) * d;
  });
}

function cell(c, i) {
  const v = c.r[i];
  if (i === TC.status) return '<td>' + statusBadge(c.status, v) + '</td>';
  const empty = v === null || v === undefined || v === '';
  const cls = i === TC.id ? 'c-id' : i === TC.title ? 'c-title' : i === TC.section ? 'c-sec' : (i === TC.steps || i === TC.expected || i === TC.precondition) ? 'c-text' : '';
  return '<td class="' + cls + (empty ? ' empty' : '') + '">' + (empty ? '–' : esc(typeof v === 'number' ? v.toLocaleString() : v)) + '</td>';
}

function render() {
  const list = sorted(filteredCases());
  const pages = Math.max(1, Math.ceil(list.length / size));
  if (page >= pages) page = pages - 1;
  const slice = list.slice(page * size, page * size + size);
  document.getElementById('count').textContent = list.length.toLocaleString() + ' of ' + CASES.length.toLocaleString() + ' test cases';
  document.getElementById('pg').textContent = 'Page ' + (page + 1) + ' of ' + pages;
  document.getElementById('prev').disabled = page === 0;
  document.getElementById('next').disabled = page >= pages - 1;
  document.getElementById('expand').hidden = view !== 'cards';
  const host = document.getElementById('view');
  if (!slice.length) { host.innerHTML = '<div class="none">No test cases match your filters.</div>'; return; }

  if (view === 'table') {
    host.innerHTML = '<div class="tablewrap"><table><thead><tr>' + ORDER.map(i => '<th data-i="' + i + '">' + esc(COLS[i].name) +
      '<span class="arr">' + (sortIdx === i ? (sortDir === 1 ? ' ▲' : ' ▼') : '') + '</span></th>').join('') + '</tr></thead><tbody>' +
      slice.map(c => '<tr>' + ORDER.map(i => cell(c, i)).join('') + '</tr>').join('') + '</tbody></table></div>';
  } else {
    const details = ORDER.filter(i => ![TC.id, TC.title, TC.section, TC.status].includes(i));
    host.innerHTML = '<div class="cards">' + slice.map(c =>
      '<details class="tc st-' + c.status.replace(' ', '') + '"' + (allOpen ? ' open' : '') + '><summary>' + (c.id ? '<span class="id">' + esc(c.id) + '</span>' : '') + '<span class="ttl">' +
      esc(c.title || '') + '</span>' + (c.section ? '<span class="sec">' + esc(c.section) + '</span>' : '') + statusBadge(c.status, c.r[TC.status]) + '</summary><div class="body">' +
      details.map(i => c.r[i] === null || c.r[i] === '' ? '' : '<div><div class="lbl">' + esc(COLS[i].name) + '</div><div class="txt">' + esc(c.r[i]) + '</div></div>').join('') +
      '</div></details>').join('') + '</div>';
  }
}

document.getElementById('view').addEventListener('click', e => {
  const th = e.target.closest('th'); if (!th) return;
  const i = +th.dataset.i;
  if (sortIdx === i) sortDir = -sortDir; else { sortIdx = i; sortDir = 1; }
  page = 0; render();
});
document.getElementById('viewSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('expand').onclick = () => {
  allOpen = !allOpen;
  document.querySelectorAll('details.tc').forEach(d => { d.open = allOpen; });
  document.getElementById('expand').textContent = allOpen ? 'Collapse all' : 'Expand all';
};
document.getElementById('size').onchange = e => { size = +e.target.value; page = 0; render(); };
document.getElementById('prev').onclick = () => { page--; render(); };
document.getElementById('next').onclick = () => { page++; render(); };
document.getElementById('csv').onclick = () => {
  const list = sorted(filteredCases());
  const q = v => { const s = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const text = [ORDER.map(i => q(COLS[i].name)).join(',')].concat(list.map(c => ORDER.map(i => q(c.r[i])).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }));
  a.download = 'test-cases-filtered.csv'; a.click(); URL.revokeObjectURL(a.href);
};
render();
</script>
</body>
</html>
