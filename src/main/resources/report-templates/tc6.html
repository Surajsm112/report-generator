<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ – Test Document</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#eef0f4; --ink:#1d2433; --line:#d9dee7; --brand:#2f4bd8; --muted:#667085; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Segoe UI, system-ui, -apple-system, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  .tools { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:10px 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .tools .grow { flex:1; }
  .printbtn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:8px 16px; cursor:pointer; font:inherit; font-weight:600; }
  .paper { max-width:1080px; margin:18px auto; background:#fff; border:1px solid var(--line); box-shadow:0 6px 24px rgba(30,40,90,.08); padding:40px 46px 50px; }
  .cover { display:grid; grid-template-columns:1fr 230px; gap:26px; align-items:center; border-bottom:3px solid var(--brand); padding-bottom:22px; margin-bottom:22px; }
  .cover .kind { color:var(--brand); font-weight:700; letter-spacing:.12em; font-size:12px; text-transform:uppercase; }
  .cover h1 { margin:6px 0 6px; font-size:30px; line-height:1.2; }
  .cover p { margin:0; color:var(--muted); font-size:14px; }
  #meta .mchip { background:#eef1fb; color:#2a3a8c; margin:8px 8px 0 0; }
  .donutw { position:relative; height:190px; } .donutw .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .donutw .c b { font-size:28px; } .donutw .c span { font-size:11px; color:var(--muted); }
  .sumtable { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 22px; }
  .sumtable div { flex:1; min-width:110px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; border-top:4px solid var(--c,#94a3b8); }
  .sumtable b { font-size:22px; display:block; } .sumtable span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  h2.toc { font-size:16px; margin:0 0 8px; }
  .tocl { columns:2; column-gap:30px; margin:0 0 26px; padding:0; list-style:none; font-size:14px; }
  .tocl li { break-inside:avoid; padding:3px 0; display:flex; justify-content:space-between; gap:10px; }
  .tocl a { color:var(--ink); text-decoration:none; } .tocl a:hover { color:var(--brand); text-decoration:underline; } .tocl span { color:var(--muted); }
  section.sec { margin:0 0 30px; }
  section.sec h2 { font-size:19px; margin:0 0 10px; padding:8px 12px; background:#f1f4fb; border-left:5px solid var(--brand); border-radius:0 8px 8px 0; display:flex; justify-content:space-between; gap:10px; align-items:center; }
  section.sec h2 small { font-weight:400; color:var(--muted); font-size:13px; }
  table.doc { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.doc th { background:#f6f8fc; text-align:left; padding:8px 10px; border:1px solid var(--line); font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#4a5568; }
  table.doc td { padding:8px 10px; border:1px solid var(--line); vertical-align:top; white-space:pre-wrap; word-break:break-word; line-height:1.5; }
  table.doc td.id { font-weight:700; white-space:nowrap; } table.doc td.dim { color:#a0a8b8; }
  table.doc tr { break-inside:avoid; }
  .none { text-align:center; color:var(--muted); padding:40px 10px; }
  @media (max-width:700px) { .cover { grid-template-columns:1fr; } .paper { padding:24px 16px; } .tocl { columns:1; } }
  @media print {
    @page { margin:14mm 12mm; }
    body { background:#fff; } .tools { display:none; } .paper { box-shadow:none; border:0; margin:0; padding:0; max-width:none; }
    table.doc thead { display:table-header-group; } section.sec h2 { break-after:avoid; }
    .cover, .sumtable div, .sbadge, section.sec h2, table.doc th { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
<div class="tools">
  <div class="chips" id="filterBar" style="flex:1"></div>
  <button class="printbtn" onclick="window.print()">Print / Save as PDF</button>
</div>
<div class="paper">
  <div class="cover">
    <div>
      <div class="kind">Test document</div>
      <h1 id="title"></h1>
      <p id="sub"></p>
      <div id="meta"></div>
    </div>
    <div class="donutw"><canvas id="donut"></canvas><div class="c"><b id="rate">–</b><span>pass rate</span></div></div>
  </div>
  <div id="truncWarn" class="warn" hidden></div>
  <div class="sumtable" id="sum"></div>
  <h2 class="toc">Contents</h2>
  <ul class="tocl" id="toc"></ul>
  <div id="doc"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
/*__COMMON__*/
/*__TC__*/

setTcHeader();
// All columns of the sheet, in a sensible order, with the real header names.
const ORDER = [TC.id, TC.title, TC.precondition, TC.steps, TC.expected, TC.status].filter(i => i >= 0);
COLS.forEach(c => { if (!ORDER.includes(c.i) && c.i !== TC.section) ORDER.push(c.i); });

mountFilterBar(document.getElementById('filterBar'), render);
document.querySelector('#filterBar').style.display = 'flex';

function render() {
  const list = filteredCases();
  const counts = countStatus(list);
  document.getElementById('rate').textContent = pct(passRate(counts));
  document.getElementById('sum').innerHTML = '<div style="--c:#2f4bd8"><b>' + list.length + '</b><span>Test cases</span></div>' +
    STATUS_ORDER.filter(s => counts[s] > 0).map(s => '<div style="--c:' + STATUS_COLOR[s] + '"><b>' + counts[s] + '</b><span>' + STATUS_LABEL[s] + '</span></div>').join('');
  const used = STATUS_ORDER.filter(s => counts[s] > 0);
  draw('donut', { type: 'doughnut', data: { labels: used.map(s => STATUS_LABEL[s]), datasets: [{ data: used.map(s => counts[s]), backgroundColor: used.map(s => STATUS_COLOR[s]), borderWidth: 2, borderColor: '#fff' }] },
    options: { cutout: '68%', plugins: { legend: { display: false } } } });

  const names = SECTIONS.length ? SECTIONS : [null];
  const parts = names.map(n => ({ name: n, cases: list.filter(c => n === null || c.section === n) })).filter(p => p.cases.length);
  document.getElementById('toc').innerHTML = parts.length > 1 ? parts.map((p, i) => '<li><a href="#sec' + i + '">' + esc(p.name) + '</a><span>' + p.cases.length + '</span></li>').join('') : '';
  document.querySelector('h2.toc').hidden = parts.length <= 1;
  document.getElementById('doc').innerHTML = parts.length ? parts.map((p, i) =>
    '<section class="sec" id="sec' + i + '"><h2><span>' + esc(p.name || 'Test cases') + '</span><small>' + p.cases.length + ' test case' + (p.cases.length === 1 ? '' : 's') + '</small></h2>' +
    '<table class="doc"><thead><tr>' + ORDER.filter(c => p.cases.some(x => hasText(x.r[c]))).map(c => '<th>' + esc(COLS[c].name) + '</th>').join('') + '</tr></thead><tbody>' +
    p.cases.map(x => '<tr>' + ORDER.filter(c => p.cases.some(y => hasText(y.r[c]))).map(c => {
      if (c === TC.status) return '<td>' + statusBadge(x.status, x.r[c]) + '</td>';
      const v = x.r[c], t = hasText(v);
      return '<td class="' + (c === TC.id ? 'id' : '') + (t ? '' : ' dim') + '">' + (t ? esc(typeof v === 'number' ? v.toLocaleString() : String(v)) : '') + '</td>';
    }).join('') + '</tr>').join('') + '</tbody></table></section>').join('') : '<div class="none">No test cases match the current filters.</div>';
}
render();
</script>
</body>
</html>
