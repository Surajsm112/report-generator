<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ – Executive Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#f3f6fb; --card:#ffffff; --ink:#1b2a41; --muted:#6b7a90; --line:#e3e9f2; --brand:#2f5bea; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Segoe UI, system-ui, -apple-system, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(120deg,#1f3fae,#2f5bea 60%,#4aa3ff); color:#fff; padding:28px 24px 64px; }
  header h1 { margin:0 0 4px; font-size:26px; }
  header p { margin:0; opacity:.85; font-size:14px; }
  .tag { display:inline-block; background:rgba(255,255,255,.18); border-radius:20px; padding:3px 12px; font-size:12px; margin-bottom:10px; }
  main { max-width:1200px; margin:-44px auto 40px; padding:0 16px; }
  .warn { background:#fff4e0; border:1px solid #ffd9a0; color:#8a5200; padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; }
  .filters { background:var(--card); border-radius:14px; box-shadow:0 4px 18px rgba(30,60,120,.08); padding:14px 18px; margin-bottom:18px; }
  .filters summary { cursor:pointer; font-weight:600; }
  #filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:12px; }
  .f label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .f input, .f select { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  .pair { display:flex; gap:6px; } .pair input { min-width:0; }
  .actions { margin-top:12px; display:flex; gap:12px; align-items:center; }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:7px 14px; cursor:pointer; font:inherit; }
  button.ghost { background:#eef2fb; color:var(--brand); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi { background:var(--card); border-radius:14px; padding:16px 18px; box-shadow:0 4px 18px rgba(30,60,120,.08); border-left:5px solid var(--brand); }
  .kpi:nth-child(2n) { border-left-color:#f28e2b; } .kpi:nth-child(3n) { border-left-color:#59a14f; }
  .kpi .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .kpi .v { font-size:28px; font-weight:700; margin-top:4px; word-break:break-word; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:16px; }
  .card { background:var(--card); border-radius:14px; padding:16px 18px 18px; box-shadow:0 4px 18px rgba(30,60,120,.08); }
  .card h3 { margin:0 0 12px; font-size:15px; }
  .box { position:relative; height:290px; }
  .empty { color:var(--muted); text-align:center; padding-top:110px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding-bottom:30px; }
  @media (max-width:520px) { .grid { grid-template-columns:1fr; } }
  @media print { header { background:#2f5bea !important; -webkit-print-color-adjust:exact; } .filters { display:none; } }
</style>
</head>
<body>
<header>
  <div class="tag">Executive Dashboard</div>
  <h1 id="title"></h1>
  <p id="sub"></p>
</header>
<main>
  <div id="truncWarn" class="warn" hidden></div>
  <details class="filters" open>
    <summary>Quick filters <span id="count" style="font-weight:400;color:var(--muted)"></span></summary>
    <div id="filters"></div>
    <div class="actions"><button class="ghost" id="reset">Reset filters</button></div>
  </details>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="card"><h3 id="t1"></h3><div class="box"><canvas id="c1"></canvas></div></div>
    <div class="card"><h3 id="t2"></h3><div class="box"><canvas id="c2"></canvas></div></div>
    <div class="card"><h3 id="t3"></h3><div class="box"><canvas id="c3"></canvas></div></div>
    <div class="card"><h3 id="t4"></h3><div class="box"><canvas id="c4"></canvas></div></div>
  </div>
</main>
<footer>Generated by Report Generator · all filtering happens in your browser</footer>
<script>
const DATA = /*__DATA__*/null;
/*__COMMON__*/

setHeader();
const filterCols = [].concat(dateCols.slice(0, 1), catCols.slice(0, 3), numCols.slice(0, 1));
if (!filterCols.length) { document.querySelector('.filters').hidden = true; }
const F = makeFilters($('#filters'), filterCols, render);
$('#reset').onclick = F.reset;

const n0 = numCols[0] || null, n1 = numCols[1] || null;
const c0 = catCols[0] || null, c1 = catCols[1] || catCols[0] || null;
const d0 = dateCols[0] || null;

function kpis(rows) {
  const list = [{ l: 'Records', v: rows.length.toLocaleString() }];
  numCols.slice(0, 2).forEach(c => {
    const vals = numbersOf(rows, c.i);
    const sum = vals.reduce((a, b) => a + b, 0);
    if (isSummable(c.name)) list.push({ l: 'Total ' + c.name, v: fmt(sum) });
    list.push({ l: 'Average ' + c.name, v: fmt(vals.length ? sum / vals.length : null) });
  });
  if (c0) {
    const counts = aggregate(rows, c0.i, null, 'count').sort((a, b) => b[1] - a[1]);
    list.push({ l: 'Top ' + c0.name, v: counts.length ? String(counts[0][0]) : '–' });
  }
  if (d0 && list.length < 6) list.push({ l: d0.name + ' range', v: (d0.minDate || '') + ' → ' + (d0.maxDate || '') });
  $('#kpis').innerHTML = list.slice(0, 6).map(k => '<div class="kpi"><div class="l">' + esc(k.l) +
    '</div><div class="v">' + esc(k.v) + '</div></div>').join('');
}

function show(i, title, ok) {
  $('#t' + i).textContent = title;
  const box = $('#c' + i).parentElement;
  box.querySelector('.empty')?.remove();
  $('#c' + i).style.display = ok ? '' : 'none';
  if (!ok) box.insertAdjacentHTML('beforeend', '<div class="empty">Not enough data for this chart</div>');
}

function render() {
  const rows = F.apply();
  $('#count').textContent = '· showing ' + rows.length.toLocaleString() + ' of ' + ROWS.length.toLocaleString() + ' rows';
  kpis(rows);

  // 1. Trend over time (or distribution of the first number)
  if (d0) {
    const s = trendSeries(rows, d0, n0 ? n0.i : null, 'sum');
    show(1, (n0 ? n0.name : 'Records') + ' over time', s.length > 0);
    draw('c1', { type: 'line', data: { labels: s.map(p => p[0]), datasets: [{ label: n0 ? n0.name : 'Records', data: s.map(p => p[1]),
      borderColor: PALETTE[0], backgroundColor: 'rgba(78,121,167,.15)', fill: true, tension: .3, pointRadius: 2 }] },
      options: { plugins: { legend: { display: false } } } });
  } else if (n0) {
    const h = histogram(numbersOf(rows, n0.i));
    show(1, 'Distribution of ' + n0.name, h.counts.length > 0);
    draw('c1', { type: 'bar', data: { labels: h.labels, datasets: [{ data: h.counts, backgroundColor: PALETTE[0] }] },
      options: { plugins: { legend: { display: false } } } });
  } else show(1, 'Trend', false);

  // 2. Top categories by the first number
  if (c0) {
    const p = topN(aggregate(rows, c0.i, n0 ? n0.i : null, 'sum'), 10, 'Other').filter(x => x[0] !== 'Other');
    show(2, (n0 ? n0.name : 'Records') + ' by ' + c0.name, p.length > 0);
    draw('c2', { type: 'bar', data: { labels: p.map(x => x[0]), datasets: [{ data: p.map(x => x[1]), backgroundColor: PALETTE[1] }] },
      options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
  } else show(2, 'Top categories', false);

  // 3. Share by a category
  if (c1) {
    const p = topN(aggregate(rows, c1.i, null, 'count'), 6);
    show(3, 'Share of records by ' + c1.name, p.length > 0);
    draw('c3', { type: 'doughnut', data: { labels: p.map(x => x[0]), datasets: [{ data: p.map(x => x[1]), backgroundColor: colors(p.length) }] },
      options: { plugins: { legend: { position: 'right' } } } });
  } else show(3, 'Share by category', false);

  // 4. Second number by category, or the second number over time
  if (n1 && c0) {
    const p = topN(aggregate(rows, c0.i, n1.i, 'avg'), 10, 'Other').filter(x => x[0] !== 'Other');
    show(4, 'Average ' + n1.name + ' by ' + c0.name, p.length > 0);
    draw('c4', { type: 'bar', data: { labels: p.map(x => x[0]), datasets: [{ data: p.map(x => x[1]), backgroundColor: PALETTE[3] }] },
      options: { plugins: { legend: { display: false } } } });
  } else if (n1 && d0) {
    const s = trendSeries(rows, d0, n1.i, 'avg');
    show(4, 'Average ' + n1.name + ' over time', s.length > 0);
    draw('c4', { type: 'line', data: { labels: s.map(p => p[0]), datasets: [{ data: s.map(p => p[1]), borderColor: PALETTE[3], tension: .3, pointRadius: 2 }] },
      options: { plugins: { legend: { display: false } } } });
  } else if (n1) {
    const h = histogram(numbersOf(rows, n1.i));
    show(4, 'Distribution of ' + n1.name, h.counts.length > 0);
    draw('c4', { type: 'bar', data: { labels: h.labels, datasets: [{ data: h.counts, backgroundColor: PALETTE[3] }] },
      options: { plugins: { legend: { display: false } } } });
  } else show(4, 'More insights', false);
}
render();
</script>
</body>
</html>
