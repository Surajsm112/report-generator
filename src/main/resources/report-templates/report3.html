<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ – Insights &amp; Data Quality</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#f5f7fb; --card:#ffffff; --ink:#1a2438; --muted:#66748b; --line:#e2e8f2; --accent:#4f46e5; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Segoe UI, system-ui, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:26px 24px 10px; max-width:1250px; margin:0 auto; }
  header .tag { color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
  header h1 { margin:6px 0 4px; font-size:28px; } header p { margin:0; color:var(--muted); font-size:14px; }
  main { max-width:1250px; margin:0 auto; padding:10px 24px 50px; }
  h2 { font-size:17px; margin:30px 0 12px; }
  .warn { background:#fff4e0; border:1px solid #ffd9a0; color:#8a5200; padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; }
  .chips { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .chip .v { font-size:26px; font-weight:700; } .chip .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .alerts { display:grid; gap:8px; }
  .alert { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:8px; padding:10px 14px; font-size:14px; }
  .alert.ok { border-left-color:var(--ok); } .alert.bad { border-left-color:var(--bad); }
  .cols { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
  .col { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .col h3 { margin:0 0 6px; font-size:15px; display:flex; justify-content:space-between; gap:8px; align-items:center; word-break:break-word; }
  .type { font-size:10px; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.06em; flex:none; }
  .NUMBER { background:#dbeafe; color:#1e40af; } .DATE { background:#dcfce7; color:#166534; }
  .CATEGORY { background:#ede9fe; color:#5b21b6; } .TEXT { background:#fef3c7; color:#92400e; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px 10px; font-size:12px; color:var(--muted); margin:8px 0 10px; }
  .stats b { display:block; color:var(--ink); font-size:14px; }
  .bar { height:5px; background:var(--line); border-radius:4px; overflow:hidden; margin:2px 0 4px; } .bar i { display:block; height:100%; background:var(--bad); }
  .mini { position:relative; height:130px; }
  .toplist { font-size:12px; color:var(--muted); line-height:1.7; }
  table.corr { border-collapse:separate; border-spacing:3px; font-size:12px; }
  table.corr th { color:var(--muted); font-weight:500; padding:4px 8px; text-align:center; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.corr td { text-align:center; padding:9px 10px; border-radius:6px; min-width:64px; color:var(--ink); font-variant-numeric:tabular-nums; }
  .scroll { overflow:auto; } .note { color:var(--muted); font-size:13px; margin:0 0 10px; }
</style>
</head>
<body>
<header>
  <div class="tag">Insights &amp; Data Quality</div>
  <h1 id="title"></h1>
  <p id="sub"></p>
</header>
<main>
  <div id="truncWarn" class="warn" hidden></div>
  <h2>Overview</h2>
  <div class="chips" id="chips"></div>
  <h2>Data quality checks</h2>
  <div class="alerts" id="alerts"></div>
  <div id="corrSection" hidden>
    <h2>Correlation between numeric columns</h2>
    <p class="note">+1 = rise together, −1 = one rises while the other falls, 0 = no linear relation.</p>
    <div class="scroll" id="corr"></div>
  </div>
  <h2>Column profiles</h2>
  <div class="cols" id="cols"></div>
</main>
<script>
const DATA = /*__DATA__*/null;
/*__COMMON__*/

setHeader();
Chart.defaults.color = '#66748b';
Chart.defaults.borderColor = '#e2e8f2';

// ---- overview ----
const cells = ROWS.length * COLS.length;
const missingCells = COLS.reduce((s, c) => s + c.missing, 0);
const seen = new Set(); let dupes = 0;
for (const r of ROWS) { const k = JSON.stringify(r); if (seen.has(k)) dupes++; else seen.add(k); }
const chips = [
  ['Rows', ROWS.length.toLocaleString()], ['Columns', COLS.length],
  ['Missing cells', (cells ? (missingCells / cells * 100).toFixed(1) : 0) + '%'],
  ['Duplicate rows', dupes.toLocaleString()],
  ['Numeric', numCols.length], ['Dates', dateCols.length], ['Categories', catCols.length], ['Text', textCols.length]
];
$('#chips').innerHTML = chips.map(c => '<div class="chip"><div class="v">' + c[1] + '</div><div class="l">' + c[0] + '</div></div>').join('');

// ---- outliers (IQR rule) ----
const outliers = {};
numCols.forEach(c => {
  const vals = numbersOf(ROWS, c.i).sort((a, b) => a - b);
  const q1 = quantile(vals, .25), q3 = quantile(vals, .75);
  if (q1 === null) return;
  const iqr = q3 - q1, lo = q1 - 1.5 * iqr, hi = q3 + 1.5 * iqr;
  outliers[c.i] = { n: iqr === 0 ? 0 : vals.filter(v => v < lo || v > hi).length, q1, q3 };
});

// ---- alerts ----
const alerts = [];
COLS.forEach(c => {
  const pct = ROWS.length ? c.missing / ROWS.length * 100 : 0;
  if (pct >= 50) alerts.push(['bad', '<b>' + esc(c.name) + '</b> is empty in ' + pct.toFixed(0) + '% of rows.']);
  else if (pct >= 10) alerts.push(['warn', '<b>' + esc(c.name) + '</b> has ' + pct.toFixed(0) + '% missing values.']);
  if (c.distinct === 1 && ROWS.length > 1) alerts.push(['warn', '<b>' + esc(c.name) + '</b> has the same value in every row.']);
  if (c.type === 'TEXT' && ROWS.length > 20 && c.distinct === ROWS.length - c.missing) alerts.push(['ok', '<b>' + esc(c.name) + '</b> looks like a unique identifier.']);
  const o = outliers[c.i];
  if (o && o.n > 0) alerts.push(['warn', '<b>' + esc(c.name) + '</b> has ' + o.n + ' outlier value' + (o.n > 1 ? 's' : '') + ' (far from the middle 50%).']);
});
if (dupes > 0) alerts.push(['warn', dupes.toLocaleString() + ' duplicate row' + (dupes > 1 ? 's' : '') + ' found.']);
if (!alerts.length) alerts.push(['ok', 'No data-quality problems found.']);
$('#alerts').innerHTML = alerts.map(a => '<div class="alert ' + a[0] + '">' + a[1] + '</div>').join('');

// ---- correlation ----
function corr(ai, bi) {
  let n = 0, sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
  for (const r of ROWS) {
    const a = r[ai], b = r[bi];
    if (typeof a !== 'number' || typeof b !== 'number') continue;
    n++; sa += a; sb += b; saa += a * a; sbb += b * b; sab += a * b;
  }
  if (n < 3) return null;
  const d = Math.sqrt((n * saa - sa * sa) * (n * sbb - sb * sb));
  return d === 0 ? null : (n * sab - sa * sb) / d;
}
const cc = numCols.slice(0, 8);
if (cc.length >= 2) {
  $('#corrSection').hidden = false;
  let h = '<table class="corr"><tr><th></th>' + cc.map(c => '<th title="' + esc(c.name) + '">' + esc(c.name) + '</th>').join('') + '</tr>';
  cc.forEach(a => {
    h += '<tr><th>' + esc(a.name) + '</th>';
    cc.forEach(b => {
      const v = a === b ? 1 : corr(a.i, b.i);
      const bg = v === null ? '#eef1f6' : v >= 0 ? 'rgba(124,92,255,' + (0.15 + .85 * v) + ')' : 'rgba(255,92,122,' + (0.15 + .85 * -v) + ')';
      h += '<td style="background:' + bg + ';' + (v !== null && Math.abs(v) > 0.6 ? 'color:#fff' : '') + '">' + (v === null ? '–' : v.toFixed(2)) + '</td>';
    });
    h += '</tr>';
  });
  $('#corr').innerHTML = h + '</table>';
}

// ---- column profiles ----
const shown = COLS.slice(0, 40);
$('#cols').innerHTML = shown.map(c => {
  const pct = ROWS.length ? c.missing / ROWS.length * 100 : 0;
  let stats = '<div><b>' + c.distinct.toLocaleString() + '</b>distinct</div><div><b>' + pct.toFixed(1) + '%</b>missing</div>';
  let extra = '';
  if (c.type === 'NUMBER') {
    stats += '<div><b>' + fmt(c.min) + '</b>min</div><div><b>' + fmt(c.max) + '</b>max</div><div><b>' + fmt(c.mean) +
      '</b>mean</div><div><b>' + fmt(c.median) + '</b>median</div><div><b>' + fmt(c.sum) + '</b>sum</div>' +
      '<div><b>' + (outliers[c.i] ? outliers[c.i].n : 0) + '</b>outliers</div>';
    extra = '<div class="mini"><canvas id="m' + c.i + '"></canvas></div>';
  } else if (c.type === 'DATE') {
    stats += '<div><b>' + (c.minDate || '–') + '</b>first</div><div><b>' + (c.maxDate || '–') + '</b>last</div>';
    extra = '<div class="mini"><canvas id="m' + c.i + '"></canvas></div>';
  } else if (c.type === 'CATEGORY') {
    extra = '<div class="mini"><canvas id="m' + c.i + '"></canvas></div>';
  } else {
    const top = topN(aggregate(ROWS, c.i, null, 'count'), 5, 'Other').filter(p => p[0] !== 'Other');
    extra = '<div class="toplist">Most common: ' + top.map(p => esc(String(p[0]).slice(0, 28)) + ' (' + p[1] + ')').join(' · ') + '</div>';
  }
  return '<div class="col"><h3>' + esc(c.name) + '<span class="type ' + c.type + '">' + c.type + '</span></h3>' +
    '<div class="bar" title="missing"><i style="width:' + pct + '%"></i></div><div class="stats">' + stats + '</div>' + extra + '</div>';
}).join('');
if (COLS.length > shown.length) {
  $('#cols').insertAdjacentHTML('beforeend', '<div class="col">Showing the first ' + shown.length + ' of ' + COLS.length + ' columns.</div>');
}

const base = { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } } } };
shown.forEach(c => {
  if (c.type === 'NUMBER') {
    const h = histogram(numbersOf(ROWS, c.i), 10);
    draw('m' + c.i, { type: 'bar', data: { labels: h.labels, datasets: [{ data: h.counts, backgroundColor: '#4f46e5' }] }, options: base });
  } else if (c.type === 'DATE') {
    const s = trendSeries(ROWS, c, null, 'count');
    draw('m' + c.i, { type: 'bar', data: { labels: s.map(p => p[0]), datasets: [{ data: s.map(p => p[1]), backgroundColor: '#3ecf8e' }] }, options: base });
  } else if (c.type === 'CATEGORY') {
    const p = topN(aggregate(ROWS, c.i, null, 'count'), 8, 'Other');
    draw('m' + c.i, { type: 'bar', data: { labels: p.map(x => x[0]), datasets: [{ data: p.map(x => x[1]), backgroundColor: '#d6aaff' }] }, options: base });
  }
});
</script>
</body>
</html>
