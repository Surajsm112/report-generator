<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ – Categories</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --g1:#ea580c; --g2:#ec4899; --bg:#fff6f1; }
  .two { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:center; margin-bottom:12px; }
  @media (max-width:760px) { .two { grid-template-columns:1fr; } }
  .rk { color:#9a8c86; width:28px; }
</style>
</head>
<body>
<header>
  <span class="tag">Categories</span>
  <h1 id="title"></h1>
  <p id="sub"></p>
</header>
<main>
  <div id="truncWarn" class="vwarn" hidden></div>
  <div class="vstats" id="stats"></div>
  <div class="vgrid" id="grid"></div>
</main>
<script>
const DATA = /*__DATA__*/null;
/*__COMMON__*/
/*__VIZ__*/

setHeader();
const m = numCols[0] || null;
const sumLike = !m || isSummable(m.name);
const aggK = !m ? 'count' : sumLike ? 'sum' : 'avg';
let cats = catCols.slice(0, 3);
if (!cats.length) cats = textCols.filter(c => c.distinct >= 2 && c.distinct <= 80 && c.distinct < ROWS.length * 0.9).slice(0, 2);
const grid = document.getElementById('grid');
const PAIRS = [['#ea580c', '#fdba74'], ['#db2777', '#f9a8d4'], ['#7c3aed', '#c4b5fd']];

if (!cats.length) {
  document.getElementById('stats').innerHTML = statCard('Records', ROWS.length.toLocaleString(), '', '#ea580c', '#ec4899');
  grid.innerHTML = vcard('No category columns found', '', emptyNote('This view groups the data by columns with repeating labels (for example Region or Product). This file has none.'), 'vwide');
} else {
  const total = m ? numbersOf(ROWS, m.i).reduce((a, b) => a + b, 0) : ROWS.length;
  const first = topN(aggregate(ROWS, cats[0].i, m ? m.i : null, aggK), 99).filter(p => p[0] !== 'Other');
  const leader = first[0];
  document.getElementById('stats').innerHTML =
    statCard('Records', ROWS.length.toLocaleString(), cats.length + ' grouping column' + (cats.length > 1 ? 's' : ''), '#ea580c', '#fb923c') +
    statCard(m ? (sumLike ? 'Total ' : 'Average ') + m.name : 'Records', m ? fmt(sumLike ? total : numbersOf(ROWS, m.i).reduce((a, b) => a + b, 0) / Math.max(1, numbersOf(ROWS, m.i).length)) : ROWS.length, 'all rows', '#db2777', '#f472b6') +
    statCard('Top ' + cats[0].name, leader ? String(leader[0]) : '–', leader ? fmt(leader[1]) + (m ? ' ' + (sumLike ? 'total' : 'average') : ' records') : '', '#7c3aed', '#a78bfa') +
    statCard(cats[0].name + ' values', first.length, 'different values', '#0891b2', '#22d3ee');

  const cards = [], draws = [];
  cats.forEach((c, i) => {
    const all = aggregate(ROWS, c.i, m ? m.i : null, aggK).sort((a, b) => b[1] - a[1]);
    const top = all.slice(0, 10);
    const share = topN(all, 6);
    const sumAll = all.reduce((a, p) => a + p[1], 0);
    const maxV = top.length ? top[0][1] : 1;
    const counts = new Map(aggregate(ROWS, c.i, null, 'count'));
    const [c1, c2] = PAIRS[i % PAIRS.length];
    const title = (m ? (sumLike ? m.name : 'Average ' + m.name) : 'Records') + ' by ' + c.name;
    const table = '<table class="vt"><thead><tr><th class="rk">#</th><th>' + esc(c.name) + '</th><th class="n">Records</th><th class="n">' + esc(m ? (sumLike ? m.name : 'Average') : 'Records') + '</th><th>' + (sumLike ? 'Share' : 'Relative') + '</th></tr></thead><tbody>' +
      top.map((p, k) => '<tr><td class="rk">' + (k + 1) + '</td><td>' + esc(String(p[0])) + '</td><td class="n">' + (counts.get(p[0]) || 0).toLocaleString() + '</td><td class="n"><b>' + fmt(p[1]) + '</b></td>' +
        '<td style="min-width:150px"><div class="pbar"><i style="width:' + (sumLike && sumAll ? p[1] / sumAll * 100 : p[1] / maxV * 100) + '%;background:linear-gradient(90deg,' + c1 + ',' + c2 + ')"></i></div></td></tr>').join('') + '</tbody></table>' +
      (all.length > 10 ? '<div class="vsub" style="margin-top:8px">Showing the top 10 of ' + all.length + ' values.</div>' : '');
    cards.push(vcard(title, all.length + ' different values', '<div class="two"><div class="vbox" style="height:' + Math.max(220, top.length * 32 + 40) + 'px"><canvas id="b' + i + '"></canvas></div><div class="vbox" style="height:260px"><canvas id="d' + i + '"></canvas></div></div>' + table, 'vwide'));
    draws.push(() => {
      draw('b' + i, { type: 'bar', data: { labels: top.map(p => shortName(String(p[0]), 26)), datasets: [{ data: top.map(p => p[1]), backgroundColor: hGradient(c2, c1), borderRadius: 8 }] },
        options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v => fmt(v) } }, y: { grid: { display: false } } } } });
      draw('d' + i, { type: 'doughnut', data: { labels: share.map(p => shortName(String(p[0]), 22)), datasets: [{ data: share.map(p => p[1]), backgroundColor: share.map((_, k) => lerpColor(c1, c2, k / Math.max(1, share.length - 1))), borderColor: '#fff', borderWidth: 3 }] },
        options: { cutout: '58%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } } } });
    });
  });
  grid.innerHTML = cards.join('');
  draws.forEach(f => f());
}
function shortName(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }
</script>
</body>
</html>
